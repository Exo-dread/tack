name: Tack Focus (web)

on:
  push:
    branches: [main]
    paths: ['web/**', 'tests/vectors/**', '.github/workflows/web.yml']
  # Every pull request, whatever it touches: main only accepts pull requests whose checks pass,
  # and a check that never runs would hold a desktop-only change forever.
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck, unit tests and build
        run: |
          npm run build
          npm test

      - name: End-to-end tests (WebKit and Chromium)
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
        env:
          CI: 'true'

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: tack-focus-dist-${{ github.sha }}
          path: web/dist
          retention-days: 14

  # Publishing: GitHub builds the site and uploads it to Cloudflare Pages once the tests pass.
  # Cloudflare's own builds from Git are paused (they kept stalling in its build queue); DEPLOY.md
  # has the setup. A merge to main goes to tackfocus.app; a pull request from this repository gets
  # a preview at <branch>.tack-6kt.pages.dev.
  #
  # Two jobs, so the Cloudflare token never shares a job with the repository's own code: build-site
  # runs the branch's build; deploy only uploads that result, with a wrangler locked in
  # .github/cloudflare (exact versions, integrity hashes, installed without install scripts).
  build-site:
    needs: test
    # Pull requests from forks get no secrets, so only this repository's branches are previewed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as pushed (the tests ran on its merge with main).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build with the Microsoft app ID
        env:
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_MS_AUTHORITY: ${{ vars.VITE_MS_AUTHORITY }}
        run: |
          # Without the ID the site would quietly ship without sync.
          if [ -z "$VITE_MS_CLIENT_ID" ]; then
            echo "::error::Set the repository variable VITE_MS_CLIENT_ID (see web/DEPLOY.md)."
            exit 1
          fi
          npm run build
          grep -q "$VITE_MS_CLIENT_ID" dist/.well-known/microsoft-identity-association.json

      - name: Keep the site for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_id }}
          path: web/dist
          include-hidden-files: true # .well-known/
          retention-days: 7

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      # A newer push replaces a preview still uploading; production deploys wait their turn.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: .github/cloudflare
    steps:
      # Only the locked wrangler manifest and the Node version: none of the repository's code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            .github/cloudflare
            web/.node-version
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: .github/cloudflare/package-lock.json

      - name: Install the locked wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.run_id }}
          path: site

      - name: Check the site still has the Microsoft app ID
        working-directory: site
        env:
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
        run: grep -q "$VITE_MS_CLIENT_ID" .well-known/microsoft-identity-association.json

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (see web/DEPLOY.md)."
            exit 1
          fi
          ./node_modules/.bin/wrangler pages deploy "$GITHUB_WORKSPACE/site" --project-name tack --branch "$BRANCH" --commit-hash "$SHA" --commit-dirty=true

      # Cloudflare's builds from Git are paused, yet it still queues one for every push and leaves
      # it "idle". One that ever started late could put an older version back live, so any still
      # waiting is cancelled (uploads like the one above are never idle). Never fails the deploy.
      - name: Cancel builds Cloudflare queued on its own
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/tack/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ids=$(curl -fsS -H "$auth" "$api" | jq -r '.result[] | select(.latest_stage.status == "idle") | .id')
          if [ -z "$ids" ]; then
            echo "Nothing queued."
            exit 0
          fi
          for id in $ids; do
            if curl -fsS -X POST -H "$auth" "$api/$id/cancel" > /dev/null || curl -fsS -X DELETE -H "$auth" "$api/$id" > /dev/null; then
              echo "Cancelled Cloudflare's queued build $id"
            else
              echo "::warning::Couldn't cancel Cloudflare's queued build $id"
            fi
          done
